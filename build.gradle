plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.maven_group
project.ext.lwjglVersion = "3.3.3"

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neoforge_version
    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            programArgument '--nogui'
        }
    }

    mods {
        voxy {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom runtimeOnly
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.caffeinemc.net/releases" }
}

def gitCommitHash = { ->
    try {
        var result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }.result.get()

        if (result.getExitValue() != 0) {
            return "<UnknownCommit>"
        } else {
            return providers.exec {
                commandLine = ['git', 'rev-parse', 'HEAD']
            }.standardOutput.asText.get().strip()
        }
    } catch (Exception ignored) {
        return "<UnknownCommit>"
    }
}

def buildtime = { System.currentTimeSeconds() }

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version, "commit": hash, "buildtime": time
    }
}

configurations {
    lwjglNativesRaw
}

dependencies {
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"
}

def extractedNativesDir = layout.buildDirectory.dir("extracted-natives")

tasks.register('extractLwjglNatives') {
    description = 'Extracts native binaries from LWJGL native JARs for bundling'
    group = 'build'

    inputs.files(configurations.lwjglNativesRaw)
    outputs.dir(extractedNativesDir)

    doLast {
        def outputDir = extractedNativesDir.get().asFile
        outputDir.mkdirs()

        configurations.lwjglNativesRaw.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def inputJar = artifact.file
            logger.lifecycle("Extracting natives from ${inputJar.name}")

            // Extract only native binaries (.dll, .so, .dylib)
            copy {
                from(zipTree(inputJar)) {
                    include '**/*.dll'
                    include '**/*.so'
                    include '**/*.dylib'
                    // Flatten directory structure - put all natives at root
                    eachFile { fcp ->
                        fcp.relativePath = new RelativePath(true, fcp.name)
                    }
                    includeEmptyDirs = false
                }
                into outputDir
            }
        }

        // List extracted files
        outputDir.listFiles()?.each { file ->
            logger.lifecycle("  Extracted: ${file.name}")
        }
    }
}

tasks.named('jar') {
    dependsOn 'extractLwjglNatives'

    from(extractedNativesDir) {
        into ''
    }
}

dependencies {

    jarJar(implementation("org.lwjgl:lwjgl-lmdb:$lwjglVersion"))
    jarJar(implementation("org.lwjgl:lwjgl-zstd:$lwjglVersion"))

    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion"
    // Natives also need to be on runtime classpath (LWJGL extracts from classpath)
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"

    //compileOnly('redis.clients:jedis:5.1.0')

    compileOnly('org.rocksdb:rocksdbjni:10.2.1')
    jarJar('org.rocksdb:rocksdbjni:10.2.1')

    //runtimeOnly('org.apache.commons:commons-pool2:2.12.0')
    //runtimeOnly('org.lz4:lz4-java:1.8.0')

    compileOnly('org.tukaani:xz:1.10')
    jarJar('org.tukaani:xz:1.10')

    compileOnly(files("lib/sodium-neoforge-0.8.12-alpha.4+mc1.21.1.jar"))
    compileOnly("maven.modrinth:sodium:mc1.21.1-0.8.12-alpha.4-neoforge")
    runtimeOnly("maven.modrinth:sodium:mc1.21.1-0.8.12-alpha.4-neoforge")

    compileOnly("maven.modrinth:lithium:mc1.21.1-0.15.3-neoforge")
    compileOnly("maven.modrinth:sodium-extra:mc1.21.1-0.8.7+neoforge")
    compileOnly("maven.modrinth:chunky:1.4.23-neoforge")
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}